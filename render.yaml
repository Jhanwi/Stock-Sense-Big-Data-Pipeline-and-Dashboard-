services:
  - type: web
    name: stock-sense-backend
    env: docker
    plan: free
    port: 8000
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: ap-south-1
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false

